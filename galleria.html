<!DOCTYPE html>
<html lang="it">
<head>
    <style>body { background-color: #eaf6db; }</style>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galleria - Polo d'Infanzia Madre Teresa di Calcutta</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/components.js" defer></script>
</head>
<body>
    <site-header></site-header>
    <main style="padding: 1rem 2rem;">
        <h1 style="color: var(--c-forest); font-family: var(--font-script); font-size: 3rem; text-align: center; margin-bottom: 1rem;">Galleria Fotografica</h1>
        <div style="background: white; padding: 2rem; border-radius: var(--radius-md); box-shadow: var(--shadow-sm); margin-bottom: 2rem; text-align: center;">
            <p style="color: var(--c-text-muted); margin-bottom: 1rem;">Alcuni scatti dei nostri spazi, dei laboratori e delle attività vissute dai bambini.</p>
            <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem; margin-top: 2rem;">
                <div style="background: var(--c-surface-soft); aspect-ratio: 1; border-radius: var(--radius-sm); display: flex; align-items: center; justify-content: center; color: var(--c-text-muted);">Foto Spazi</div>
                <div style="background: var(--c-surface-soft); aspect-ratio: 1; border-radius: var(--radius-sm); display: flex; align-items: center; justify-content: center; color: var(--c-text-muted);">Foto Laboratori</div>
                <div style="background: var(--c-surface-soft); aspect-ratio: 1; border-radius: var(--radius-sm); display: flex; align-items: center; justify-content: center; color: var(--c-text-muted);">Foto Eventi</div>
                <div style="background: var(--c-surface-soft); aspect-ratio: 1; border-radius: var(--radius-sm); display: flex; align-items: center; justify-content: center; color: var(--c-text-muted);">Foto Giardino</div>
            </div>
        </div>
    </main>
    <site-footer></site-footer>
</body>
</html>
